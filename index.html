<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Shabda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Courier+Prime&family=Noto+Serif+Devanagari&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff3f6;--bg2:#f1e7ff;--ink:#5a2745;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1230;--bg2:#190f2e;--ink:#ffe3ee}}
:root[data-theme="dark"]{--bg1:#2a1230;--bg2:#190f2e;--ink:#ffe3ee}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;-webkit-tap-highlight-color:transparent}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4rem;padding:1rem;text-align:center;transition:opacity 1.2s ease,filter 1.2s ease}
#start.gone{opacity:0;filter:blur(14px);pointer-events:none}
h1{margin:0;font-weight:600;font-size:clamp(2.3rem,10vw,3.6rem);line-height:1.1}
#dot{width:5.5rem;height:5.5rem;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 30%,#ff9a9a,#e11d2e 55%,#8f0f1d);box-shadow:0 0 0 0 #e11d2e88,0 10px 30px -8px #e11d2e;animation:pulse 1.8s ease-out infinite}
#dot:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;filter:blur(12px);pointer-events:none}
#scene.on{opacity:1;filter:blur(0);transition:opacity 1.5s ease,filter 1.5s ease}
#scene.on.fade{opacity:0;filter:blur(14px);transition:opacity 2.4s ease,filter 2.4s ease}
svg{width:min(100vw,30rem);max-height:92vh;height:auto;overflow:visible}
.garden{transform-origin:180px 450px;animation:sway 6s ease-in-out infinite alternate}
.stem{stroke-dasharray:1;stroke-dashoffset:1}
.grow .stem{stroke-dashoffset:0;transition:stroke-dashoffset 3.4s ease-in-out var(--d)}
.lf{transform:scale(0);transition:transform 1.7s ease-out var(--d)}
.grow .lf{transform:scale(1)}
.bud{opacity:1;transition:opacity 1s ease 0s}
.pt{transform:rotate(var(--a)) scale(.04);transition:transform 2.6s cubic-bezier(.2,.8,.3,1.1) var(--d)}
.bloom .pt{transform:rotate(var(--a)) scale(1)}
.bloom .bud{opacity:0}
#cats{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;filter:blur(14px);pointer-events:none;transition:opacity 1.8s ease,filter 1.8s ease}
#cats.on{opacity:1;filter:blur(0);pointer-events:auto}
#cw{position:relative;width:min(88vw,22rem);cursor:pointer;transform:scale(.28);transform-origin:50% 100%;filter:blur(10px);transition:transform 5s ease-out,filter 5s ease-out}
#cw.arrive{transform:scale(1);filter:blur(0)}
#cw.walking{animation:waddle .7s ease-in-out infinite alternate}
#cw svg{width:100%;height:auto;overflow:visible;display:block}
.eye{transform-box:fill-box;transform-origin:center}
.sit .eye{animation:blink 4.3s infinite}
.look .eye{animation:blink .6s 2}
.head{transform-origin:150px 200px;transition:transform .6s ease}
.look .head{transform:rotate(-9deg) translate(8px,-3px)}
.tail{transform-origin:222px 300px;animation:wag 3s ease-in-out infinite alternate}
.walking .bodyg{animation:bob .35s ease-in-out infinite alternate}
.walking .pl{animation:stepa .7s ease-in-out infinite alternate}
.walking .pr{animation:stepa .7s ease-in-out infinite alternate-reverse}
.pw{transition:transform .8s ease}
.give .pw{transform:translateY(-26px)}
#env{position:absolute;left:12%;width:76%;bottom:6%;opacity:0;transform:translateY(60px) scale(.3);transform-origin:50% 100%;transition:opacity .6s ease,transform 1.2s cubic-bezier(.2,1.3,.4,1);pointer-events:none}
.give #env{opacity:1;transform:none;pointer-events:auto;animation:float 3s ease-in-out 1.3s infinite alternate}
#env.tap{animation:wiggle .5s ease}
#hint{margin:1.2rem 0 0;color:var(--ink);opacity:0;filter:blur(6px);transition:opacity 1s ease,filter 1s ease;font-size:1.1rem;min-height:1.6rem}
#hint.on{opacity:.75;filter:blur(0)}
@keyframes waddle{from{rotate:-1.6deg}to{rotate:1.6deg}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes stepa{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.06)}}
@keyframes wag{from{transform:rotate(-5deg)}to{transform:rotate(9deg)}}
@keyframes float{from{translate:0 0}to{translate:0 -8px}}
@keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-3deg}75%{rotate:3deg}}
#env{overflow:visible}
.open #env{transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.25);animation:mblur 1.4s ease,mblur .9s ease 1.5s;transition:transform 1.4s ease}
.open .csvg,.open #hint{opacity:0;transition:opacity 1.2s ease}
.fo,.fi{transform-origin:0 24px}
.fi{visibility:hidden}
.flap-open .fo{animation:fclose .5s ease-in forwards}
.flap-open .fi{visibility:visible;animation:fopen .55s ease-out .5s both}
.flap-open .lt{animation:rise 1.5s ease-in-out 1.1s forwards}
.gone2 #cw{opacity:0;transition:opacity 1.4s ease}
#lp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem 1rem 5rem;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
#lp.on{opacity:1;pointer-events:auto}
.paper{width:min(92vw,34rem);max-height:76vh;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;filter:blur(10px);padding:1.8rem 1.4rem;border-radius:3px;white-space:pre-wrap;overflow-wrap:anywhere;color:#33230f;font-family:"Courier Prime","Noto Serif Devanagari",monospace;font-size:1.02rem;line-height:1.75;background:radial-gradient(circle at 18% 12%,#8a6a3a33,#0000 38%),radial-gradient(ellipse at 50% 40%,#dcc79a,#cfb582 60%,#b9975f);box-shadow:inset 0 0 70px #6b4a1f99,0 20px 50px -15px #000a;transform:translateY(22vh) scale(.55);transition:transform 1.8s cubic-bezier(.2,.8,.2,1),filter 1.8s ease}
#lp.on .paper{transform:none;filter:blur(0)}
.cur{display:inline-block;width:.6em;height:1.1em;vertical-align:-.15em;background:#33230f;animation:cur 1s steps(1) infinite}
.cur.end{animation:cur 1s steps(1) 4;opacity:0}
#more{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));translate:-50% 0;font:inherit;font-weight:600;font-size:1.1rem;color:#fff;border:0;border-radius:2rem;padding:.9rem 1.9rem;cursor:pointer;background:linear-gradient(135deg,#ff7fa8,#e11d2e);opacity:0;filter:blur(8px);pointer-events:none;transition:opacity 1.2s ease,filter 1.2s ease;animation:glow 2s ease-in-out infinite alternate}
#more.on{opacity:1;filter:blur(0);pointer-events:auto}
#vid{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:#000d;opacity:0;filter:blur(14px);pointer-events:none;transition:opacity 1.4s ease,filter 1.4s ease}
#vid.on{opacity:1;filter:blur(0);pointer-events:auto}
#v{width:min(96vw,44rem);max-height:80vh;border-radius:14px;background:#000;box-shadow:0 0 60px -10px #ff7fa8aa}
#cakes{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem;text-align:center;opacity:0;filter:blur(14px);pointer-events:none;transition:opacity 1.8s ease,filter 1.8s ease}
#cakes.on{opacity:1;filter:blur(0);pointer-events:auto}
#cakes h2{margin:0;font-weight:600;font-size:clamp(1.8rem,8vw,2.4rem)}
#cakes .sub{margin:.3rem 0 .8rem;opacity:.75}
#cakes svg{cursor:pointer;max-height:68vh}
.flame{transform-box:fill-box;transform-origin:center bottom;animation:flick .5s ease-in-out infinite alternate}
.ht{position:fixed;bottom:-3rem;z-index:9;pointer-events:none;animation:floatup 4s ease-in forwards}
@keyframes glow{from{box-shadow:0 0 12px #ff7fa8aa}to{box-shadow:0 0 34px 8px #ff4d7dcc}}
@keyframes knife{0%{opacity:0;transform:translateY(-30px)}15%{opacity:1;transform:translateY(0)}55%,75%{opacity:1;transform:translateY(155px)}100%{opacity:0;transform:translateY(-30px)}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
@keyframes floatup{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-110vh) rotate(25deg);opacity:0;filter:blur(4px)}}
#fin{position:fixed;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center;perspective:800px;opacity:0;filter:blur(14px);pointer-events:none;transition:opacity 2s ease,filter 2s ease}
#fin.on{opacity:1;filter:blur(0)}
#ftxt{position:relative;z-index:3;text-align:center;padding:1rem;transform-style:preserve-3d;animation:tilt 7s ease-in-out infinite alternate;pointer-events:none}
.ln{font-weight:600;font-size:clamp(1.7rem,9vw,3rem);line-height:1.2;color:#fff;letter-spacing:.02em}
.ln.big{font-size:clamp(2.8rem,15vw,5rem)}
.ln span{display:inline-block;margin:0 .12em;animation:wob 2.6s ease-in-out infinite alternate;animation-delay:calc(var(--i)*.18s);text-shadow:1px 1px 0 #ffb3cb,2px 2px 0 #ff9bbb,3px 3px 0 #ff86ac,4px 4px 0 #ff739f,5px 5px 0 #ee5b8c,6px 6px 0 #d94479,7px 7px 0 #b92f64,8px 8px 12px #6a1a3a88}
.fall{position:fixed;top:-3rem;z-index:2;pointer-events:none;animation:fdown 8s linear forwards}
.ph{position:fixed;left:0;top:0;z-index:1;width:4.4rem;padding:.28rem .28rem .8rem;background:#fff;border-radius:3px;box-shadow:0 6px 16px -6px #0007;pointer-events:none;will-change:transform,filter,opacity}
.ph i{display:grid;place-items:center;aspect-ratio:1;font-style:normal;color:#fff;background:linear-gradient(135deg,#ffc2d6,#d9c2ff) center/cover}
@keyframes tilt{from{transform:rotateX(12deg) rotateY(-12deg)}to{transform:rotateX(6deg) rotateY(12deg)}}
@keyframes wob{from{transform:translateY(0)}to{transform:translateY(-.14em)}}
@keyframes fdown{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--sw,30px),115vh) rotate(var(--rt,200deg));opacity:.9}}
@keyframes mblur{0%,100%{filter:blur(0)}40%{filter:blur(5px)}}
@keyframes fclose{to{transform:scaleY(0)}}
@keyframes fopen{from{transform:scaleY(0)}to{transform:scaleY(-1)}}
@keyframes rise{to{transform:translateY(-120px)}}
@keyframes cur{50%{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #e11d2e88,0 10px 30px -8px #e11d2e}70%,100%{box-shadow:0 0 0 2.2rem #e11d2e00,0 10px 30px -8px #e11d2e}}
@keyframes sway{from{transform:rotate(-1.1deg)}to{transform:rotate(1.4deg)}}
@media (prefers-reduced-motion:reduce){#dot,.garden{animation:none}}
</style>
</head>
